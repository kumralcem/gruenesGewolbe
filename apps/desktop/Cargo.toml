[package]
name = "gruenes-gewolbe-desktop"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "gruenes_gewolbe_desktop"
path = "src/lib.rs"

[features]
tauri-runtime = ["dep:tauri", "dep:tauri-plugin-dialog", "dep:tauri-plugin-opener", "dep:reqwest", "dep:scraper"]

[[bin]]
name = "gruenes-gewolbe"
path = "src/main.rs"
required-features = ["tauri-runtime"]

[dependencies]
gruenes-gewolbe-core = { path = "../../crates/archive-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", optional = true, default-features = false, features = ["blocking", "json", "rustls-tls"] }
scraper = { version = "0.20", optional = true }
tauri = { version = "2", optional = true, features = [] }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-opener = { version = "2", optional = true }

[build-dependencies]
tauri-build = { version = "2", features = [] }
